name: Bug report
description: Report a problem with PhotoCue
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PhotoCue. Please do not include personal field notes or backups.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device & browser
      placeholder: e.g. Android 14, Chrome 140 / iPhone, Safari 18 / installed PWA
    validations:
      required: true
  - type: dropdown
    id: offline
    attributes:
      label: Were you offline?
      options:
        - "No"
        - "Yes"
        - "Not sure"
